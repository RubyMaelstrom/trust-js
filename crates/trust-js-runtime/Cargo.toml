# The runtime spine: assembles an Engine + extensions and owns the event loop (the engine is
# !Send, so one loop thread owns it; blocking work runs on trust-js-host's threadpool and comes
# back as mpsc completions). Also home to the light host globals that don't earn their own
# crate yet: the streaming console and a minimal `process`. Std-only.
[package]
name = "trust-js-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
trust-js-fs = { path = "../trust-js-fs" }
trust-js-host = { path = "../trust-js-host" }
trust-js-node = { path = "../trust-js-node" }
trust-js-timers = { path = "../trust-js-timers" }
trust-js-web = { path = "../trust-js-web" }

[features]
# P1 S2: run on the engine's tracing heap.
gc-heap = ["trust-js-host/gc-heap"]

[lints]
workspace = true

[[bench]]
name = "runtime"
harness = false
