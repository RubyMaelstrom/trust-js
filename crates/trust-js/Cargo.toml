[package]
name = "trust-js"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# A from-scratch JavaScript engine. Native segmented stack switching keeps ordinary ECMAScript
# execution contexts independent of the Rust thread stack. The optional whole-function backend
# uses Cranelift, at the same revision as TRust's WebAssembly backend. The engine is exercised by
# the Test262 runner and exposes an optional embedding API for
# independent runtimes; it does not assume a particular downstream JavaScript host.

[dependencies]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
stacker = "0.1.25"

[target.'cfg(all(any(target_arch = "aarch64", target_arch = "x86_64"), any(target_os = "linux", target_os = "macos", target_os = "windows")))'.dependencies]
# Keep these in lockstep with TRust/vendor/wasmi-2.0.0. This opt-in feature requires Rust 1.96;
# it does not add a Wasmtime runtime or replace TRust JS's GC, JS semantics, or W^X code ownership.
cranelift-codegen = { version = "=0.136.2", optional = true }
cranelift-frontend = { version = "=0.136.2", optional = true }
cranelift-native = { version = "=0.136.2", optional = true }

[features]
default = ["intl"]
# ECMA-402 (`Intl`) and the CLDR data tables backing it — the single largest contributor to
# binary size. Disable (`--no-default-features`) for a small build: the `Intl` global is absent
# and the `toLocale*` methods degrade to their locale-independent forms (like engines built
# without i18n support).
intl = []
# The curated embedder surface (`trust_js::embed`: Ctx, host state, define_global, event-loop
# hooks) used by the trust-js-host/trust-js-runtime crates. Off by default: everything under it is a
# public-API commitment on a published crate, gated until it stabilizes with those crates.
embed = []
# Exposes internal compilation stages (`trust_js::bench_api`) for the `internals` benchmark. Not a
# stability commitment — for measurement only.
bench = []
# Allocation/call-cache observations compiled out of ordinary engine builds.
architecture-diagnostics = []
# Opt-in central-heap handle bridge used by migration tests. It records one checked handle per
# live object while the existing `Rc<RefCell<Object>>` graph remains authoritative; never enabled
# by the default production build until relocation and differential gates are complete.
heap-bridge = []
# Under development: explicit opt-in for whole-function code generation and conformance work.
# Runtime activation additionally requires TRUST_JS_OPT_JIT=1. Not a production tier-selection
# default until JS specialization, deoptimization, and application-level regression gates pass.
optimizing-jit = ["dep:cranelift-codegen", "dep:cranelift-frontend", "dep:cranelift-native"]

[lints]
workspace = true

# Std-only benchmark harness (see benches/support/harness.rs) — no third-party bench crate.
[[bench]]
name = "engine"
harness = false

# Internal-stage benchmarks (lexer/parser/snapshot). Needs the `bench` feature for `bench_api`.
[[bench]]
name = "internals"
harness = false
required-features = ["bench"]
