# The substrate every TRust JS op crate and the runtime share: the Extension/OpDecl registration
# model (deno_core's shape), plus the two scheduling primitives (threadpool completions and
# loop-turn callbacks) that timers/fs/net are all built on. Sits *below* the op crates so the
# runtime <-> ops dependency cycle never forms. Std-only, like everything in this workspace.
[package]
name = "trust-js-host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
trust-js = { path = "../trust-js", features = ["embed"] }

[features]
# P1 S2: run on the engine's tracing heap (see docs/v8-chase-p1-plan-2026-10-15.txt).
gc-heap = ["trust-js/gc-heap"]

[lints]
workspace = true
