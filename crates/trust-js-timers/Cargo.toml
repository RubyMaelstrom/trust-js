# Timer op crate: setTimeout/setInterval/clearTimeout/clearInterval/setImmediate. The timer
# heap lives in OpState; the runtime's loop asks it for the next deadline and the due batch
# each turn (the ops themselves never sleep or spawn). Std-only.
[package]
name = "trust-js-timers"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
trust-js-host = { path = "../trust-js-host" }

[features]
# P1 S4: run on the engine's tracing heap.
gc-heap = ["trust-js-host/gc-heap"]

[lints]
workspace = true
