# WinterTC "Minimum Common Web Platform API" op crate: Event/AbortController, TextEncoder/
# TextDecoder, atob/btoa, structuredClone, URL/URLSearchParams, performance.now, crypto
# (getRandomValues/randomUUID/subtle.digest), fetch (HTTP and verified HTTPS through a dynamically
# loaded system OpenSSL). Pure-JS pieces ship as js_init glue;
# Rust backs the parsing/crypto/network ops. See lib.rs for the conformance checklist.
[package]
name = "trust-js-web"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
trust-js-host = { path = "../trust-js-host" }
trust-js-tls = { path = "../trust-js-tls" }
# The Servo parser tracks the WHATWG URL state machine and delegates domain processing to the
# URL-profiled UTS #46 implementation in `idna`. Keeping this as one audited implementation also
# prevents fetch/WebSocket/EventSource and the JavaScript URL API from drifting apart.
whatwg-url = { package = "url", version = "2.5.8" }
# ICU4X 2.1+ carries the Unicode 17 mapping, normalization, and property data required by the
# current UTS #46 corpus; adapter 1.2.2 requires ICU4X 2.2 or newer.
idna-adapter = { package = "idna_adapter", version = "1.2.2" }
# Firefox's pure-Rust implementation of the WHATWG Encoding algorithms and canonical label table.
encoding_rs = "0.8.42"

# Build-only: used by build.rs to parse the JS glue and emit its AST snapshot (no runtime dep).
[build-dependencies]
trust-js = { path = "../trust-js" }

[features]
# P1 S4: run on the engine's tracing heap.
gc-heap = ["trust-js-host/gc-heap"]

[lints]
workspace = true
