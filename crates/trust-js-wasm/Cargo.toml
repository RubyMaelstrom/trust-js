# WebAssembly bindings for the playground (https://github.com/RubyMaelstrom/trust-js). Not published;
# build locally with wasm-pack for use by site/worker.js.
[package]
name = "trust-js-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
trust-js = { path = "../trust-js" }
wasm-bindgen = "0.2"
js-sys = "0.3"

[lints]
workspace = true
