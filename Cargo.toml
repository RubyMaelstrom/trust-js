[workspace]
resolver = "2"
members = [
    "crates/trust-js",
    "crates/trust-js-cli",
    "crates/trust-js-difftest",
    "crates/trust-js-fs",
    "crates/trust-js-host",
    "crates/trust-js-node",
    "crates/trust-js-repl",
    "crates/trust-js-runtime",
    "crates/trust-js-timers",
    "crates/trust-js-tls",
    "crates/trust-js-typescript",
    "crates/trust-js-web",
    "crates/trust-js-wasm",
    "crates/wasm-spec-runner",
    "crates/test262-runner",
]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT"
rust-version = "1.88"

# Lints shared by every crate (each crate opts in with `[lints] workspace = true`). Two lints
# fight the nature of an engine — deeply nested callback / `dyn Fn` types and pipeline functions
# that legitimately take many parameters — everything else stays denied in CI
# (`cargo clippy -- -D warnings`).
[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"
doc_lazy_continuation = "allow"
needless_range_loop = "allow"

# Optimize the release build of the engine; debug stays fast to compile.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
